{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShopEase - Under Maintenance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      /* Background Gradient */
      background-size: 400% 400%;

      animation: gradientBG 12s ease infinite;
      overflow: hidden;
      position: relative;
    }

    /* Floating cart icons */
    .cart-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .cart {
      position: absolute;
      font-size: 40px;
      opacity: 0.12;
      animation: float 20s linear infinite;
    }

    .cart:nth-child(1) { left: 10%; color: #ff9800; animation-delay: 0s; font-size: 60px; }
    .cart:nth-child(2) { left: 30%; color: #29b6f6; animation-delay: 5s; font-size: 50px; }
    .cart:nth-child(3) { left: 50%; color: #ffb74d; animation-delay: 10s; font-size: 70px; }
    .cart:nth-child(4) { left: 70%; color: #4fc3f7; animation-delay: 15s; font-size: 55px; }
    .cart:nth-child(5) { left: 90%; color: #ffa726; animation-delay: 7s; font-size: 65px; }

    @keyframes float {
      0% { top: 100%; transform: translateY(0) rotate(0deg); }
      100% { top: -10%; transform: translateY(-110%) rotate(360deg); }
    }

    /* Gradient Animation */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    header {
      display: flex;
      align-items: center;
      padding: 10px 20px;
      background-color: rgba(255, 255, 255, 0.85);
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: relative;
      z-index: 1;
    }

    header img {
      height: 50px;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      flex-direction: column;
      position: relative;
      z-index: 1;
    }

    h1, p, .spinner {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s ease forwards;
    }

    h1 {
      font-size: 2rem;
      color: #333;
      margin-bottom: 10px;
      animation-delay: 0.2s;
    }

    p {
      font-size: 1.2rem;
      color: #444;
      margin-bottom: 20px;
      animation-delay: 0.5s;
    }

    /* Modern Spinner */
    .spinner {
  width: 60px;
  height: 60px;
  border: 6px solid transparent;
  border-top: 6px solid #ff9800;
  border-right: 6px solid #29b6f6;
  border-bottom: 6px solid #ffb74d;
  border-left: 6px solid #4fc3f7;
  border-radius: 50%;
  animation: spin 1s linear infinite, fadeInUp 1s ease forwards;
  animation-delay: 0.8s, 0.8s;
}

@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

    /* Fade-in + slide-up */
    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Spinner rotation */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <!-- Add FontAwesome for shopping cart icons -->
  <script src="https://kit.fontawesome.com/yourkitid.js" crossorigin="anonymous"></script>
</head>
<body>
  <!-- Floating Background Carts -->
  <div class="cart-bg">
    <i class="fas fa-shopping-cart cart"></i>
    <i class="fas fa-shopping-cart cart"></i>
    <i class="fas fa-shopping-cart cart"></i>
    <i class="fas fa-shopping-cart cart"></i>
    <i class="fas fa-shopping-cart cart"></i>
  </div>

  <header>
     <div class="max-w-7xl mx-auto px-4 flex flex-wrap sm:flex-nowrap justify-between items-center gap-3">
      <a href="/" class="flex-shrink-0">
        <img src="{% static 'images/logo1.png' %}" alt="ShopEase Logo" class="h-10 sm:h-14 md:h-16 w-auto" />
      </a>
    </div>
  </header>

  <main>
    <h1>We’ll be back soon!</h1>
    <p>Our Accessories is currently under maintenance.<br>
       Please visit us later.</p>
    <div class="spinner"></div>
  </main>
</body>
</html>
