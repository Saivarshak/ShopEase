{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShopEase - Kids</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barriecito&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      min-height: 100vh;
      position: relative;
      background-repeat: no-repeat;
      background-attachment: scroll;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-color: rgba(0, 0, 0, 0.38);
      z-index: 0;
    }

    header, section, footer {
      position: relative;
      z-index: 1;
    }

    .footersection {
      background-color: rgba(251, 251, 214, 0.39);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 20px;
    }
    @media (min-width: 1024px) {
      .footersection {
        position: fixed;
        bottom: 0;
        width: 100%;
      }
    }
    .topbanner {
      background-color: rgba(254, 219, 112, 1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 20px;
    }
    .card {
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 20px;
    }
    .mainheading {
      font-family: "Barriecito", system-ui;
      font-weight: 400;
      font-style: normal;
    }
    h1.size {
      font-size: 28px;
    }
    @media (min-width: 640px) {
      h1.size { font-size: 35px; }
    }
  </style>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandPink: '#c52667',
            brandCoral: '#ff5c39',
            brandDark: '#2f2f2f',
            brandMuted: '#999999',
            brandLight: '#fdfdfd',
            beige: '#eaba83ff'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif']
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-brandLight text-brandDark"
      style="background-image: url('{{ page_background_url }}'); background-size: cover; background-position: center;">

<!-- Header -->
<header class="topbanner shadow-md py-4">
  <div class="max-w-7xl mx-auto px-4 flex flex-wrap sm:flex-nowrap justify-between items-center gap-3">
    <a href="/" class="flex-shrink-0">
      <img src="{% static logo_image %}" alt="ShopEase Logo" class="h-10 sm:h-14 md:h-16 w-auto" />
    </a>
    <h1 class="text-lg sm:text-2xl font-bold mainheading text-brandDark size text-center w-full sm:w-auto">
      Kids Collection
    </h1> 
    <a href="/" class="bg-brandPink hover:bg-pink-700 text-white px-3 py-2 rounded-full text-xs sm:text-sm md:text-base transition">
      ← Back to Home
    </a>
  </div>
</header>

<!-- Category Section -->
<section class="max-w-7xl mx-auto px-4 sm:px-6 py-10 sm:py-16">
  <h2 class="text-2xl sm:text-3xl font-semibold text-center mb-8 sm:mb-12 text-brandDark">Kids Gallery</h2>

  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6 sm:gap-10">
    {% for item in kids_categories %}
    <a href="{{ item.page_url }}" class="rounded-xl overflow-hidden shadow hover:shadow-xl transition transform hover:scale-105 bg-white card">
      <img src="{% static item.image_path %}" alt="{{ item.name }}" class="w-full h-48 sm:h-64 object-cover" loading="lazy" decoding="async">
      <div class="p-4 text-center">
        <h3 class="text-lg sm:text-xl font-semibold text-brandDark">{{ item.name }}</h3>
        <p class="text-brandMuted text-sm mt-2">{{ item.description }}</p>
      </div>
    </a>
    {% empty %}
    <div class="col-span-full bg-white/80 rounded-xl p-6 shadow text-center">
      <p class="text-brandMuted">No kids categories found in the database.</p>
    </div>
    {% endfor %}
  </div>
</section>

<!-- Footer -->
<footer class="footersection py-6 border-t mt-12 text-center text-sm sm:text-base">
  <div class="w-full px-4 sm:px-10 text-brandMuted">
    &copy; 2025 <strong class="text-brandDark">ShopEase</strong>. All rights reserved. | Built by <span class="text-brandCoral font-semibold">MR Technologies</span>
  </div>
</footer>

</body>
</html>
