{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f5f5f5; color: #111; }
    .header { background: #000; color: #fff; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
    .header a { color: #fff; text-decoration: none; }
    .wrap { max-width: 900px; margin: 48px auto; padding: 0 20px; }
    .panel { background: #fff; border-radius: 8px; padding: 36px; box-shadow: 0 16px 40px rgba(0,0,0,.08); text-align: center; }
    .panel h1 { margin: 0 0 12px; font-size: 34px; }
    .panel p { margin: 0 0 22px; color: #4b5563; }
    .btn { display: inline-flex; min-height: 42px; align-items: center; justify-content: center; padding: 0 18px; border-radius: 6px; background: #000; color: #fff; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="header">
    <div>{{ page_title }}</div>
    <a href="{% url 'fashion_catalog' %}">Back to Catalog</a>
  </div>
  <main class="wrap">
    <section class="panel">
      <h1>Under Maintenance</h1>
      <p>{{ status_message }}</p>
      <a class="btn" href="{% url 'fashion_catalog' %}">Explore Available Fashion</a>
    </section>
  </main>
</body>
</html>
