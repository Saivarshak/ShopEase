{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      background: linear-gradient(135deg, #fef3f2, #fff7ed);
    }
    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 24px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
      padding: 36px;
    }
    .logo { display:block; width:120px; margin:0 auto 12px auto; }
    h1 { text-align:center; margin-bottom:20px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display:block; margin-bottom:8px; font-size:14px; color:#000000; }
    .form-group input {
      width:100%;
      padding:12px 14px;
      border:1px solid #ccc;
      border-radius:12px;
      font-size:16px;
    }
    .btn {
      width:100%;
      border:none;
      border-radius:12px;
      background:#000000;
      color:white;
      padding:12px;
      font-size:16px;
      cursor:pointer;
    }
    .btn:hover { background:#8b5cf6; }
    .message {
      margin-bottom: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #fee4e2;
      color: #000000;
      font-size: 14px;
    }
    .login-link { margin-top:16px; text-align:center; }
    .login-link a { color:#000000; text-decoration:none; }
  </style>
</head>
<body>
  <div class="container">
    <img src="{% static 'images/logo1.png' %}" alt="Logo" class="logo">
    <h1>Create Account</h1>

    {% if messages %}
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'register' %}">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next_url }}">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm password" required>
      </div>
      <button type="submit" class="btn">Register</button>
    </form>

    <div class="login-link">
      Already have an account? <a href="{% url 'login' %}?next={{ next_url }}">Login</a>
    </div>
  </div>
</body>
</html>
