<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page_title }}</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #000000; }
    .header { background: #000000; color: white; padding: 16px 28px; display: flex; justify-content: space-between; align-items: center; }
    .header a { color: white; text-decoration: none; }
    .wrap { max-width: 1000px; margin: 32px auto; padding: 0 20px; }
    .card { background: white; border-radius: 18px; padding: 24px; box-shadow: 0 14px 40px rgba(0, 0, 0, 0.08); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    label { font-weight: 700; font-size: 14px; }
    input, select, textarea { border: 1px solid #d0d5dd; border-radius: 12px; padding: 12px 14px; font-size: 14px; }
    textarea { min-height: 100px; resize: vertical; }
    .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .btn { border: none; border-radius: 999px; padding: 12px 18px; font-weight: 700; cursor: pointer; text-decoration: none; }
    .btn-primary { background: #000000; color: white; }
    .btn-secondary { background: #000000; color: white; }
    .btn:hover { background: #14b8a6; color: white; }
    .message { margin-bottom: 16px; padding: 14px; border-radius: 12px; background: #fff7ed; color: #000000; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="header">
    <div>{{ page_title }}</div>
    <div style="display:flex;gap:12px;align-items:center;">
      <a href="{% url 'admin_control_center' %}">Back to Dashboard</a>
      <a href="{% url 'logout' %}">Logout</a>
    </div>
  </div>

  <div class="wrap">
    {% if messages %}
      {% for message in messages %}
        <div class="message">{{ message }}</div>
      {% endfor %}
    {% endif %}

    <div class="card">
      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="grid">
          <div class="field">
            <label>Product Name</label>
            <input type="text" name="product_name" value="{{ product.product_name|default:'' }}" required>
          </div>
          <div class="field">
            <label>Brand</label>
            <input type="text" name="brand" value="{{ product.brand|default:'' }}">
          </div>
          <div class="field">
            <label>Category</label>
            <select name="category_id" required>
              <option value="">Select category</option>
              {% for category in categories %}
                <option value="{{ category.category_id }}" {% if product and product.category_id == category.category_id %}selected{% endif %}>{{ category.category_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label>Subcategory</label>
            <select name="subcategory_id" required>
              <option value="">Select subcategory</option>
              {% for subcategory in subcategories %}
                <option value="{{ subcategory.subcategory_id }}" {% if product and product.subcategory_id == subcategory.subcategory_id %}selected{% endif %}>{{ subcategory.category.category_name }} - {{ subcategory.subcategory_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="field full">
            <label>Fashion Category</label>
            <select name="fashion_category_id">
              <option value="">Use legacy category only</option>
              {% for fashion_category in fashion_categories %}
                <option value="{{ fashion_category.fashion_category_id }}" {% if product and product.fashion_category_id == fashion_category.fashion_category_id %}selected{% endif %}>
                  {{ fashion_category.full_path }}
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="field">
            <label>SKU</label>
            <input type="text" name="sku" value="{{ product.sku|default:'' }}" required>
          </div>
          <div class="field">
            <label>Price</label>
            <input type="number" step="0.01" name="price" value="{{ product.price|default:'' }}" required>
          </div>
          <div class="field">
            <label>Discount Percent</label>
            <input type="number" step="0.01" name="discount_percent" value="{{ product.discount_percent|default:'0' }}">
          </div>
          <div class="field">
            <label>Stock Quantity</label>
            <input type="number" name="quantity" min="0" value="{{ variant.quantity|default:'0' }}">
          </div>
          <div class="field">
            <label>Size</label>
            <input type="text" name="size" value="{{ variant.size|default:'' }}">
          </div>
          <div class="field full">
            <label>Multiple Sizes and Quantities</label>
            <textarea name="size_quantities" placeholder="S: 5&#10;M: 8&#10;L: 2">{{ size_quantities_value }}</textarea>
            <small>Use one line per size like <code>S: 5</code>. If this is filled, it will create separate size variants and override the single size/quantity fields above.</small>
          </div>
          <div class="field">
            <label>Color</label>
            <input type="text" name="color" value="{{ variant.color|default:'' }}">
          </div>
          <div class="field full">
            <label>Description</label>
            <textarea name="description">{{ product.description|default:'' }}</textarea>
          </div>
          <div class="field">
            <label>Image 1 Filename</label>
            <input type="text" name="image1" value="{{ variant.image1|default:'' }}" placeholder="example.jpg">
            <input type="file" name="image1_upload" accept="image/*">
          </div>
          <div class="field">
            <label>Image 2 Filename</label>
            <input type="text" name="image2" value="{{ variant.image2|default:'' }}" placeholder="example.jpg">
            <input type="file" name="image2_upload" accept="image/*">
          </div>
          <div class="field">
            <label>Image 3 Filename</label>
            <input type="text" name="image3" value="{{ variant.image3|default:'' }}" placeholder="example.jpg">
            <input type="file" name="image3_upload" accept="image/*">
          </div>
          <div class="field">
            <label>Image 4 Filename</label>
            <input type="text" name="image4" value="{{ variant.image4|default:'' }}" placeholder="example.jpg">
            <input type="file" name="image4_upload" accept="image/*">
          </div>
          <div class="field full">
            <label><input type="checkbox" name="is_active" {% if product.is_active or not product %}checked{% endif %}> Active Product</label>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">{{ form_action_label }}</button>
          <a href="{% url 'admin_control_center' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
