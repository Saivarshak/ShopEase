{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stylish Jeans for Men</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-image: url("{{ page_background_url }}");
      height: 100%;
      width: 100%;
      background-size: cover;
      background-position: center;
      background-attachment: scroll;
      position: relative;
      padding: 21px;
    }

    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.29);
      z-index: 0;
    }

    header, .search-bar, .container, .logo {
      position: relative;
      z-index: 1;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    header h1 {
      font-size: 2.5rem;
      color: #222;
      background-color: rgba(255, 255, 255, 0.8);
      display: inline-block;
      padding: 10px 20px;
      border-radius: 10px;
    }

    .search-bar {
      display: flex;
      justify-content: center;
      margin: 20px 0;
    }

    .search-bar input {
      width: 300px;
      padding: 10px;
      border: 2px solid #007bff;
      border-radius: 25px;
      outline: none;
      transition: all 0.3s ease;
    }

    .search-bar input:focus {
      box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      padding: 10px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 25px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      text-align: center;
    }

    .card-content h3 {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .price {
      color: #28a745;
      font-weight: bold;
      margin-bottom: 15px;
      display: block;
    }

    .btn {
      background: linear-gradient(to right, #007bff, #0056b3);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      text-decoration: none;
      transition: background 0.3s ease;
      display: inline-block;
    }

    .btn:hover {
      background: linear-gradient(to right, #0056b3, #007bff);
    }

    .logo {
      height: 100px;
      width: 100px;
    }
  </style>
</head>
<body>
  <div class="flex-1 items-left">
    <a href="/">
      <img src="{% static logo_image %}" alt="ShopEase Logo" class="sm:h-14 md:h-20 w-35 logo" />
    </a>
  </div>

  <header>
    <h1>Stylish Jeans for Men</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search jeans..." />
    </div>
  </header>

  <div class="container" id="jeansContainer">
    {% for card in image_cards %}
    <div class="card" data-name="{{ card.card_name|lower }} {{ card.brand|default:''|lower }}">
      <img src="{% static card.image_path %}" alt="{{ card.product_name }}" loading="lazy" decoding="async" />
      <div class="card-content">
        <h3>{{ card.product_name }}</h3>
        <span class="price">Rs. {{ card.offer_price }}</span>
            <a href="{% url 'catalog_product_detail' card.product_id %}" class="btn">View Product</a>
      </div>
    </div>
    {% empty %}
    <div class="card">
      <div class="card-content">
        <h3>No jeans found</h3>
        <span class="price">Please add products in the database.</span>
      </div>
    </div>
    {% endfor %}
  </div>

  <script>
    const searchInput = document.getElementById('searchInput');
    const cards = document.querySelectorAll('.card');

    searchInput.addEventListener('keyup', () => {
      const searchValue = searchInput.value.toLowerCase();
      cards.forEach(card => {
        const name = (card.getAttribute('data-name') || '').toLowerCase();
        card.style.display = name.includes(searchValue) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
