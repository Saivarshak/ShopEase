{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>ShopEase Login</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;

      min-height:100vh;
      width:100%;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;

      background-image:url("{% static 'images/loginbg.jpg' %}");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-attachment:fixed;
    }

    /* =========================
       MAIN CONTAINER
    ========================== */
    .main-container{
      width:100%;
      max-width:450px;

      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
    }

    /* =========================
       LOGO
    ========================== */
    .logo-container{
      width:100%;

      display:flex;
      justify-content:center;

      margin-bottom:20px;
    }

    .logo{
      width:90px;
      height:90px;
      object-fit:contain;
    }

    /* =========================
       GLASS CARD
    ========================== */
    .container{
      width:100%;

      border-radius:28px;

      overflow:hidden;

      background:rgba(255,255,255,0.10);

      border:1px solid rgba(255,255,255,0.18);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      box-shadow:0 8px 32px rgba(0,0,0,0.25);
    }

    /* =========================
       FORM SECTION
    ========================== */
    .form-section{
      width:100%;

      padding:50px 40px;

      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    /* =========================
       HEADING
    ========================== */
    .form-section h2{
      font-size:42px;
      font-weight:700;

      color:#ffffff;

      text-align:center;

      margin-bottom:35px;

      line-height:1.2;
    }

    /* =========================
       MESSAGE
    ========================== */
    .message{
      margin-bottom:18px;

      padding:12px 14px;

      border-radius:12px;

      background:rgba(255,255,255,0.12);

      color:#ffffff;

      font-size:14px;

      border:1px solid rgba(255,255,255,0.15);
    }

    /* =========================
       FORM GROUP
    ========================== */
    .form-group{
      margin-bottom:22px;
    }

    .form-group label{
      display:block;

      margin-bottom:8px;

      color:#ffffff;

      font-size:14px;
      font-weight:500;
    }

    /* =========================
       INPUT
    ========================== */
    .form-group input{
      width:100%;

      padding:15px 18px;

      border:none;

      border-radius:14px;

      background:rgba(255,255,255,0.12);

      border:1px solid rgba(255,255,255,0.15);

      color:#ffffff;

      font-size:15px;

      outline:none;

      transition:0.3s ease;
    }

    .form-group input::placeholder{
      color:rgba(255,255,255,0.75);
    }

    .form-group input:focus{
      border-color:rgba(255,255,255,0.4);

      box-shadow:0 0 0 4px rgba(255,255,255,0.10);
    }

    /* =========================
       BUTTON
    ========================== */
    .btn-login{
      width:100%;

      padding:15px;

      border:none;
      border-radius:14px;

      background:rgba(255,255,255,0.18);

      color:#ffffff;

      font-size:16px;
      font-weight:600;

      cursor:pointer;

      margin-top:10px;

      transition:0.3s ease;
    }

    .btn-login:hover{
      background:rgba(255,255,255,0.28);

      transform:translateY(-2px);
    }

    /* =========================
       REGISTER TEXT
    ========================== */
    .register-text{
      margin-top:22px;

      text-align:center;

      color:#ffffff;

      font-size:14px;
    }

    .register-text a{
      color:#ffffff;

      font-weight:600;

      text-decoration:none;
    }

    .register-text a:hover{
      text-decoration:underline;
    }

    /* =========================
       TABLET
    ========================== */
    @media (max-width:768px){

      body{
        padding:20px;

        justify-content:center;
        align-items:center;
      }

      .main-container{
        max-width:400px;
      }

      .form-section{
        padding:40px 28px;
      }

      .form-section h2{
        font-size:34px;
      }
    }

    /* =========================
       MOBILE
    ========================== */
    @media (max-width:576px){

      body{
        padding:16px;

        display:flex;
        justify-content:center;
        align-items:center;
      }

      .main-container{
        width:100%;
        max-width:360px;

        margin:auto;

        display:flex;
        flex-direction:column;
        justify-content:center;
        align-items:center;
      }

      .logo-container{
        justify-content:center;
      }

      .logo{
        width:75px;
        height:75px;
      }

      .container{
        width:100%;
        border-radius:24px;
      }

      .form-section{
        padding:32px 22px;
      }

      .form-section h2{
        font-size:30px;

        text-align:center;

        margin-bottom:28px;
      }

      .form-group label{
        font-size:13px;
      }

      .form-group input{
        padding:14px;
        font-size:14px;
      }

      .btn-login{
        padding:14px;
        font-size:15px;
      }

      .register-text{
        font-size:13px;
      }
    }

  </style>
</head>

<body>

  <div class="main-container">

    <!-- Logo -->
    <div class="logo-container">
      <img
        src="{% static 'images/logo1.png' %}"
        alt="Logo"
        class="logo"
      />
    </div>

    <!-- Login Card -->
    <div class="container">

      <form
        class="form-section"
        method="post"
        action="{% url 'login' %}"
      >

        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next_url }}">

        <h2>Welcome Back!</h2>

        <!-- Messages -->
        {% if messages %}
          {% for message in messages %}
            <div class="message">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <!-- Email -->
        <div class="form-group">

          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />

        </div>

        <!-- Password -->
        <div class="form-group">

          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />

        </div>

        <!-- Login Button -->
        <button type="submit" class="btn-login">
          Login
        </button>

        <!-- Register -->
        <p class="register-text">
          New user?
          <a href="{% url 'register' %}?next={{ next_url }}">
            Create account
          </a>
        </p>

      </form>

    </div>

  </div>

</body>
</html>
