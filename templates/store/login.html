{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>E-Commerce Login</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;

      min-height:100vh;

      display:flex;
      justify-content:flex-start;
      align-items:center;

      padding-left:80px;
      padding-right:20px;

      background-image:url("{% static 'images/loginbg.jpg' %}");
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
    }

    /* Main Layout */
    .main-container{
      width:100%;
      max-width:500px;

      display:flex;
      flex-direction:column;
      align-items:flex-start;
    }

    /* Logo */
    .logo-container{
      margin-bottom:25px;
    }

    .logo{
      width:100px;
      height:100px;
      object-fit:contain;
    }

    /* Login Card */
    .container{
      width:100%;

      display:flex;

      border-radius:28px;
      overflow:hidden;

      /* Glass Effect */
      background:rgba(255,255,255,0.10);

      border:1px solid rgba(255,255,255,0.18);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      box-shadow:
        0 8px 32px rgba(0,0,0,0.25);
    }

    /* Form Area */
    .form-section{
      width:100%;

      padding:55px;

      display:flex;
      flex-direction:column;
      justify-content:center;

      background:rgba(255,255,255,0.05);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
    }

    /* Heading */
    .form-section h2{
      font-size:38px;
      font-weight:700;

      color:#ffffff;

      margin-bottom:30px;
    }

    /* Messages */
    .message{
      margin-bottom:18px;

      padding:12px 14px;

      border-radius:12px;

      background:rgba(255,255,255,0.12);

      color:#ffffff;

      font-size:14px;

      border:1px solid rgba(255,255,255,0.12);
    }

    /* Form Group */
    .form-group{
      margin-bottom:22px;
    }

    /* Labels */
    .form-group label{
      display:block;

      margin-bottom:8px;

      font-size:14px;
      font-weight:500;

      color:#ffffff;
    }

    /* Inputs */
    .form-group input{
      width:100%;

      padding:15px 18px;

      border-radius:14px;

      border:1px solid rgba(255,255,255,0.20);

      background:rgba(255,255,255,0.10);

      color:#ffffff;

      font-size:15px;

      outline:none;

      transition:0.3s ease;
    }

    /* Placeholder */
    .form-group input::placeholder{
      color:rgba(255,255,255,0.75);
    }

    /* Focus */
    .form-group input:focus{
      border-color:rgba(255,255,255,0.5);

      box-shadow:
        0 0 0 4px rgba(255,255,255,0.10);
    }

    /* Button */
    .btn-login{
      width:100%;

      padding:15px;

      border:none;
      border-radius:14px;

      background:rgba(255,255,255,0.18);

      color:#ffffff;

      font-size:16px;
      font-weight:600;

      cursor:pointer;

      margin-top:10px;

      transition:0.3s ease;
    }

    .btn-login:hover{
      background:rgba(255,255,255,0.28);

      transform:translateY(-2px);
    }

    /* Register */
    .register-text{
      margin-top:20px;

      text-align:center;

      color:#ffffff;

      font-size:14px;
    }

    .register-text a{
      color:#ffffff;

      font-weight:600;

      text-decoration:none;
    }

    .register-text a:hover{
      text-decoration:underline;
    }

    /* =========================
       TABLET
    ========================== */
    @media (max-width: 992px){

      body{
        justify-content:center;
        padding-left:20px;
      }

      .main-container{
        max-width:100%;
        align-items:center;
      }

      .container{
        width:100%;
      }

      .form-section{
        padding:40px 30px;
      }
    }

    /* =========================
       MOBILE
    ========================== */
    @media (max-width: 576px){

      body{
        padding:15px;
      }

      .logo{
        width:75px;
        height:75px;
      }

      .logo-container{
        margin-bottom:18px;
      }

      .container{
        border-radius:22px;
      }

      .form-section{
        padding:28px 20px;
      }

      .form-section h2{
        font-size:30px;
        text-align:center;
      }

      .form-group input{
        padding:13px 14px;
        font-size:14px;
      }

      .btn-login{
        padding:14px;
        font-size:15px;
      }

      .register-text{
        font-size:13px;
      }
    }

  </style>
</head>

<body>

  <div class="main-container">

    <!-- Logo -->
    <div class="logo-container">
      <img
        src="{% static 'images/logo1.png' %}"
        alt="Logo"
        class="logo"
      />
    </div>

    <!-- Login Card -->
    <div class="container">

      <!-- Form -->
      <form
        class="form-section"
        method="post"
        action="{% url 'login' %}"
      >

        {% csrf_token %}

        <input type="hidden" name="next" value="{{ next_url }}">

        <h2>Welcome Back!</h2>

        <!-- Messages -->
        {% if messages %}
          {% for message in messages %}
            <div class="message">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}

        <!-- Email -->
        <div class="form-group">
          <label for="email">
            Email Address
          </label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <!-- Password -->
        <div class="form-group">
          <label for="password">
            Password
          </label>

          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <!-- Button -->
        <button type="submit" class="btn-login">
          Login
        </button>

        <!-- Register -->
        <p class="register-text">
          New user?
          <a href="{% url 'register' %}?next={{ next_url }}">
            Create account
          </a>
        </p>

      </form>

    </div>

  </div>

</body>
</html>
