{% if request.user.is_authenticated %}
<div style="display:flex;align-items:center;gap:12px;padding:6px 14px;border-radius:999px;background:#ffffff;width:fit-content;box-shadow:0 2px 8px rgba(0,0,0,0.10);" class="user-profile-bar">
  {% if profile_photo_url %}
  <img src="{{ profile_photo_url }}" alt="Profile" style="width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid #000000;flex-shrink:0;">
  {% else %}
  <div style="width:42px;height:42px;border-radius:50%;background:#000000;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;flex-shrink:0;">
    {{ profile_initial }}
  </div>
  {% endif %}
  <div style="font-size:15px;font-weight:600;color:#000000;white-space:nowrap;">{{ profile_display_text }}</div>
</div>
{% endif %}
