{% if request.user.is_authenticated %}
<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,0.88);width:fit-content;">
  {% if profile_photo_url %}
  <img src="{{ profile_photo_url }}" alt="Profile" style="width:40px;height:40px;border-radius:999px;object-fit:cover;">
  {% else %}
  <div style="width:40px;height:40px;border-radius:999px;background:#000000;color:white;display:flex;align-items:center;justify-content:center;font-weight:700;">
    {{ profile_initial }}
  </div>
  {% endif %}
  <div style="font-size:14px;font-weight:600;color:#000000;">{{ profile_display_text }}</div>
</div>
{% endif %}
