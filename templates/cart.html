<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shopping Cart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f3f3;
  color: #111;
}

/* Header */
.header {
  background: #131921;
  color: white;
  padding: 18px 60px;
  font-size: 22px;
  font-weight: bold;
}

/* Full Width Layout */
.container {
  width: 100%;
  display: flex;
  gap: 30px;
  padding: 30px 60px;
  box-sizing: border-box;
}

/* CART SECTION */
.cart {
  flex: 4;
  background: white;
  padding: 35px;
}

.cart h1 {
  margin: 0 0 25px;
  font-size: 30px;
  font-weight: 500;
}

.cart-item {
  display: flex;
  gap: 25px;
  padding: 35px 0;
  border-top: 1px solid #e5e5e5;
}

.cart-item:first-of-type {
  border-top: none;
}

.cart-item img {
  width: 220px;
  object-fit: contain;
}

.item-details {
  flex: 1;
}

.item-title {
  font-size: 20px;
  margin-bottom: 8px;
  cursor: pointer;
}

.item-title:hover {
  color: #007185;
}

.stock {
  color: #007600;
  font-size: 15px;
  margin-bottom: 10px;
}

.price {
  font-size: 20px;
  font-weight: bold;
  min-width: 150px;
  text-align: right;
}

.qty {
  margin-top: 12px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.qty button {
  width: 32px;
  height: 32px;
  border: 1px solid #ccc;
  background: #f0f0f0;
  cursor: pointer;
  font-size: 16px;
}

.qty span {
  min-width: 25px;
  text-align: center;
  font-size: 16px;
}

.actions {
  margin-top: 10px;
  font-size: 15px;
  color: #007185;
}

.actions span {
  margin-right: 18px;
  cursor: pointer;
}

.actions span:hover {
  text-decoration: underline;
}

/* SUMMARY SECTION */
.summary {
  flex: 1.3;
  background: white;
  padding: 30px;
  height: fit-content;
  position: sticky;
  top: 30px;
}

.summary h2 {
  font-size: 20px;
  font-weight: 500;
}

.summary .total {
  font-weight: bold;
  font-size: 22px;
}

.summary label {
  display: block;
  margin: 15px 0;
  font-size: 15px;
}

.summary button {
  background: #ffd814;
  border: none;
  width: 100%;
  padding: 14px;
  font-size: 18px;
  border-radius: 22px;
  cursor: pointer;
}

.summary button:hover {
  background: #f7ca00;
}

/* Responsive */
@media (max-width: 1000px) {
  .container {
    flex-direction: column;
    padding: 20px;
  }

  .summary {
    position: static;
  }

  .cart-item {
    flex-direction: column;
  }

  .price {
    text-align: left;
    margin-top: 10px;
  }
}
</style>
</head>

<body>

<div class="header">Your Shopping Cart</div>

<div class="container">

  <div class="cart">
    <h1>Shopping Cart</h1>

    <div class="cart-item" data-price="199">
      <input type="checkbox" checked>
      <img src="https://m.media-amazon.com/images/I/61eDdQX3zxL._SY606_.jpg">

      
      <div class="item-details">
      <a href="/mens_tshirt1_detailed"><div class="item-title">T-shirt cotton ware</div></a>
        <div class="stock">In stock</div>

        <div class="qty">
          <button onclick="changeQty(this,-1)">-</button>
          <span class="count">1</span>
          <button onclick="changeQty(this,1)">+</button>
        </div>

        <div class="actions">
          <span onclick="removeItem(this)">Delete</span>
          <span>Save for later</span>
          <span>Share</span>
        </div>
      </div>

      <div class="price">₹199</div>
    </div>

  </div>

  <div class="summary">
    <h2>Subtotal (<span id="itemCount">0</span> items):
      <span class="total" id="subtotal">₹0</span>
    </h2>

    <label>
      <input type="checkbox"> This order contains a gift
    </label>

    <button>Proceed to Buy</button>
  </div>

</div>

<script>
function updateCart() {
  let total = 0;
  let count = 0;

  document.querySelectorAll('.cart-item').forEach(item => {
    const price = parseInt(item.dataset.price);
    const qty = parseInt(item.querySelector('.count').innerText);
    total += price * qty;
    count += qty;
  });

  document.getElementById("subtotal").innerText =
    "₹" + total.toLocaleString();
  document.getElementById("itemCount").innerText = count;
}

function changeQty(btn, change) {
  const countEl = btn.parentElement.querySelector('.count');
  let qty = parseInt(countEl.innerText);
  qty += change;
  if (qty < 1) return;
  countEl.innerText = qty;
  updateCart();
}

function removeItem(el) {
  el.closest('.cart-item').remove();
  updateCart();
}

updateCart();


</script>

</body>
</html>
