<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shopping Cart</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f3f6;
      margin: 0;
      padding: 20px;
    }

    .container {
      display: flex;
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .cart {
      background: #fff;
      flex: 3;
      padding: 20px;
      border-radius: 4px;
    }

    .cart h2 {
      margin-bottom: 20px;
    }

    .item {
      display: flex;
      gap: 15px;
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }

    .item img {
      width: 120px;
      height: auto;
    }

    .details {
      flex: 1;
    }

    .details h4 {
      margin: 0 0 8px;
      font-size: 16px;
    }

    .price {
      font-weight: bold;
      margin-bottom: 8px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 8px;
    }

    .qty button {
      width: 25px;
      height: 25px;
      cursor: pointer;
    }

    .delete {
      color: #0073e6;
      cursor: pointer;
      margin-top: 6px;
      display: inline-block;
    }

    .summary {
      background: #fff;
      flex: 1;
      padding: 20px;
      border-radius: 4px;
      height: fit-content;
    }

    .summary h3 {
      margin-bottom: 15px;
    }

    .summary button {
      background: #ffd814;
      border: none;
      padding: 10px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="cart">
    <h2>Shopping Cart</h2>

    <div class="item" data-price="199">
      <img src="https://via.placeholder.com/120" />
      <div class="details">
        <h4>USB Fast Charging Cable Set</h4>
        <div class="price">₹199</div>
        <div class="qty">
          <button onclick="changeQty(this, -1)">−</button>
          <span class="count">1</span>
          <button onclick="changeQty(this, 1)">+</button>
        </div>
        <div class="delete" onclick="removeItem(this)">Delete</div>
      </div>
    </div>

    <div class="item" data-price="407">
      <img src="https://via.placeholder.com/120" />
      <div class="details">
        <h4>Stainless Steel Rain Shower Head</h4>
        <div class="price">₹407</div>
        <div class="qty">
          <button onclick="changeQty(this, -1)">−</button>
          <span class="count">1</span>
          <button onclick="changeQty(this, 1)">+</button>
        </div>
        <div class="delete" onclick="removeItem(this)">Delete</div>
      </div>
    </div>

    <div class="item" data-price="3089">
      <img src="https://via.placeholder.com/120" />
      <div class="details">
        <h4>10L Instant Water Heater</h4>
        <div class="price">₹3,089</div>
        <div class="qty">
          <button onclick="changeQty(this, -1)">−</button>
          <span class="count">1</span>
          <button onclick="changeQty(this, 1)">+</button>
        </div>
        <div class="delete" onclick="removeItem(this)">Delete</div>
      </div>
    </div>

  </div>

  <div class="summary">
    <h3>Subtotal</h3>
    <p><strong id="subtotal">₹0</strong></p>
    <button>Proceed to Buy</button>
  </div>
</div>

<script>
  function updateSubtotal() {
    let total = 0;
    document.querySelectorAll('.item').forEach(item => {
      const price = parseInt(item.dataset.price);
      const qty = parseInt(item.querySelector('.count').innerText);
      total += price * qty;
    });
    document.getElementById('subtotal').innerText = '₹' + total.toLocaleString();
  }

  function changeQty(btn, change) {
    const countEl = btn.parentElement.querySelector('.count');
    let qty = parseInt(countEl.innerText);
    qty += change;
    if (qty < 1) return;
    countEl.innerText = qty;
    updateSubtotal();
  }

  function removeItem(el) {
    el.closest('.item').remove();
    updateSubtotal();
  }

  updateSubtotal();
</script>

</body>
</html>
