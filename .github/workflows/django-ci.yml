name: Django CI

on:
  push:
    branches: ["main", "Main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django tests
        run: python manage.py test store

      - name: Validate production deployment settings
        env:
          DJANGO_ENV: production
          DEBUG: "false"
          SECRET_KEY: ci-secret-key-for-deployment-checks-only-1234567890
          APP_BASE_URL: https://example.onrender.com
          PAYMENT_CALLBACK_BASE_URL: https://example.onrender.com
          SECURE_SSL_REDIRECT: "true"
          SESSION_COOKIE_SECURE: "true"
          CSRF_COOKIE_SECURE: "true"
          SECURE_CONTENT_TYPE_NOSNIFF: "true"
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
          SECURE_HSTS_PRELOAD: "true"
        run: python manage.py check --deploy
