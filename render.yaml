services:
  - type: web
    name: shopease
    runtime: python
    plan: free

    buildCommand: pip install -r requirements.production.txt

    startCommand: sh entrypoint.sh

    healthCheckPath: /health/
    autoDeployTrigger: commit

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"
      - key: DEBUG
        value: "false"
      - key: IS_PRODUCTION
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: APP_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false
      - key: RAZORPAY_MODE
        value: live
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
