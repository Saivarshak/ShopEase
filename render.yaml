services:
  - type: web
    name: shopease
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: IS_PRODUCTION
        value: "true"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shopease-db
          property: connectionString
      # Render injects an internal database URL, so TLS is not required for
      # this private-network connection. Use true only for an external URL.
      - key: DATABASE_SSL_REQUIRE
        value: "false"
      - key: DB_CONN_MAX_AGE
        value: "600"
      - key: TRUST_X_FORWARDED_PROTO
        value: "true"
      - key: USE_X_FORWARDED_HOST
        value: "true"
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "true"
      - key: SECURE_HSTS_PRELOAD
        value: "false"
      - key: RUN_MIGRATIONS
        value: "true"
      - key: COLLECT_STATIC
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: GUNICORN_THREADS
        value: "4"
      - key: GUNICORN_TIMEOUT
        value: "120"
      # Set canonical public-domain values in the Render dashboard after the
      # service exists. They remain out of version control.
      - key: APP_BASE_URL
        sync: false
      - key: PAYMENT_CALLBACK_BASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: RAZORPAY_MODE
        value: test
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_PAYMENT_LINK_OVERRIDE_URL
        sync: false
      - key: RAZORPAY_PAYMENT_HANDLE_URL
        sync: false
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SHOP_ADMIN_EMAIL
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

databases:
  - name: shopease-db
    plan: free
    databaseName: shopease
    user: shopease
    postgresMajorVersion: "16"
